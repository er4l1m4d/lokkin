name: CI

# Self-hosted runner on the dev PC (see DEPLOY.md).
# SECURITY: never add `pull_request` to this trigger list while on a
# self-hosted runner — fork PRs would execute untrusted code on the PC.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: [self-hosted, lokkin-pc]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      # build = tsc -b (real typecheck) + vite build
      - run: npm run build

  backend:
    name: Backend (install + compile check)
    runs-on: [self-hosted, lokkin-pc]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - run: python -m pip install -r requirements.txt

      - run: python -m compileall app
