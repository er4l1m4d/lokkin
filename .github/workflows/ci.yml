name: CI

# Self-hosted runner on the dev PC (see DEPLOY.md).
# SECURITY: never add `pull_request` to this trigger list while on a
# self-hosted runner — fork PRs would execute untrusted code on the PC.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: [self-hosted, nivora-pc]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      # build = tsc -b (real typecheck) + vite build
      - run: npm run build

  backend:
    name: Backend (install + tests + compile check)
    runs-on: [self-hosted, nivora-pc]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - run: python -m compileall app

      # Critical-flow suite (DEPLOY.md). Runs from repo root so the `backend`
      # package imports resolve; config lives in backend/pytest.ini.
      - name: Backend tests
        working-directory: .
        run: python -m pytest backend/tests -q
