# Render blueprint — Lokkin API (Phase 8.2)
# Deploys on every push to main (autoDeploy). DB is Neon (external), connected via DATABASE_URL.
services:
  - type: web
    name: lokkin-api
    runtime: python
    plan: free
    region: frankfurt          # closest to the cohort; change if needed
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        sync: false            # set in dashboard: Neon pooled connection string
      - key: PAYMENTS_MODE
        value: mock            # flip to real only after the DEPLOY.md real-payments checklist
      - key: DISPUTE_WINDOW_SECONDS
        value: "300"
      - key: CORS_ORIGINS
        sync: false            # set in dashboard: https://<vercel-url> (comma-separated)
      - key: ESCROW_ADDRESS
        sync: false
      - key: NIMIQ_RPC_URL
        sync: false
      - key: SETTLEMENT_TOKEN
        generateValue: true
